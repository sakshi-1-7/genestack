---
# Post-deploy: create the Trove datastore type and version, linking to the
# guest image in Glance.
#
# Run with: ansible-playbook ... --tags trove_datastore
# This requires the Trove API to be running.

# =========================================================================
# PART 1: CHECK TROVE API AVAILABILITY
# =========================================================================

- name: Check if Trove API is reachable
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} datastore list
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_api_check
  changed_when: false
  failed_when: false

- name: Skip datastore setup if Trove API is not reachable
  ansible.builtin.debug:
    msg: >-
      Trove API is not reachable (rc={{ _trove_api_check.rc }}).
      Skipping datastore setup. Run again with --tags trove_datastore
      after Trove has been deployed and is running.
  when: _trove_api_check.rc != 0

# =========================================================================
# PART 2: CREATE DATASTORE VERSION
# The Trove API auto-creates the datastore type when the first version is
# created — there is no separate 'datastore create' CLI command.
# =========================================================================

- name: Check if datastore version '{{ _trove_ds_profile.version_name }}' exists
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      source {{ genestack_venv }}/bin/activate
      openstack --os-cloud {{ os_cloud }} datastore version list "{{ _trove_ds_profile.name }}" \
        -f value -c Name 2>/dev/null | grep "^{{ _trove_ds_profile.version_name }}$"
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_dsv_check
  changed_when: false
  failed_when: false
  when: _trove_api_check.rc == 0

- name: Derive action flags
  ansible.builtin.set_fact:
    _trove_dsv_exists: "{{ _trove_dsv_check.rc == 0 and _trove_dsv_check.stdout | trim | length != 0 }}"
    _trove_do_dsv: >-
      {{
        (_trove_dsv_check.rc != 0 or _trove_dsv_check.stdout | trim | length == 0)
        or (force_create_dsv | bool)
        or (force_full_recreation | bool)
      }}

- name: Report action flags
  ansible.builtin.debug:
    msg: >-
      DSV exists={{ _trove_dsv_exists }},
      do_dsv={{ _trove_do_dsv }},
      force_rebuild={{ force_create_dsv }},
      force_full={{ force_full_recreation }}

- name: Delete existing datastore version '{{ _trove_ds_profile.version_name }}'
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      source {{ genestack_venv }}/bin/activate
      DSV_ID=$(openstack --os-cloud {{ os_cloud }} datastore version list "{{ _trove_ds_profile.name }}" \
        -f value -c Name -c ID | grep ".* {{ _trove_ds_profile.version_name }}$" 2>/dev/null | awk '{print $1}')
      openstack --os-cloud {{ os_cloud }} datastore version delete ${DSV_ID}
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when:
    - _trove_do_dsv | bool
    - _trove_dsv_exists | bool

- name: Create datastore version '{{ _trove_ds_profile.version_name }}'
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} datastore version create
      "{{ _trove_ds_profile.version_name }}"
      "{{ _trove_ds_profile.name }}"
      "{{ _trove_ds_profile.version_manager | default(_trove_ds_profile.name) }}"
      ""
      --image-tags trove,{{ _trove_ds_profile.name }},{{ _trove_ds_profile.version }},{{ trove_guest_image_os_release }}
      --active
      --default
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _trove_do_dsv | bool

# When a profile defines validation_rules_file, overwrite the datastore's
# templates/<template_family>/validation-rules.json ON the taskmanager pod with
# that file before loading it. For percona this replaces the Trove image's
# stale ~36-parameter rules with the full Percona Server 8.4 surface.
#
# The Trove package dir in the pod (/var/lib/openstack/.../site-packages) is a
# READ-ONLY filesystem, so we cannot overwrite the bundled rules file in place
# (earlier attempts hit "patch: not found", kubectl cp's "File exists", then
# "Read-only file system"). Instead we stream our JSON to a WRITABLE path in
# the pod (/tmp) over stdin, and point `db_load_datastore_config_parameters`
# (next task) at that path -- the loader accepts any readable file, it does not
# have to be the in-image template. The companion unified diff under
# files/patches/ is kept only as the reviewable/upstream-PR artifact and is NOT
# applied at runtime. Idempotent (same file each run).
- name: Stage validation-rules file for '{{ _trove_ds_profile.version_name }}' into the taskmanager pod
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      source {{ genestack_venv }}/bin/activate
      pod=$(kubectl get pods -A | grep trove-task -m 1 | awk '{print $2}')
      dst="/tmp/validation-rules-{{ _trove_ds_profile.name }}.json"
      src="{{ role_path }}/files/{{ _trove_ds_profile.validation_rules_file }}"
      # /tmp is writable; stream the file in over stdin (no patch, no kubectl
      # cp, no write to the read-only package dir), then verify it parses and
      # was expanded beyond the stale upstream subset.
      kubectl exec -i "${pod}" -n openstack -c trove-taskmanager -- \
        sh -c "cat > \"${dst}\"" < "${src}"
      kubectl exec -i "${pod}" -n openstack -c trove-taskmanager -- \
        python3 -c "import json; d=json.load(open(\"${dst}\")); assert len(d[\"configuration-parameters\"]) > 40, len(d[\"configuration-parameters\"])"
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when:
    - _trove_do_dsv | bool
    - _trove_ds_profile.validation_rules_file is defined

# Load the validation rules. When the profile staged a custom file above, load
# from the writable /tmp copy; otherwise load the image's bundled template.
- name: Load default configuration parameter validation rules for '{{ _trove_ds_profile.version_name }}'
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      source {{ genestack_venv }}/bin/activate
      trove_taskmanager_pod_name=$(kubectl get pods -A | grep trove-task -m 1 | awk '{print $2}')
      rules_path="{% if _trove_ds_profile.validation_rules_file is defined %}/tmp/validation-rules-{{ _trove_ds_profile.name }}.json{% else %}/var/lib/openstack/lib/python3.12/site-packages/trove/templates/{{ _trove_ds_profile.template_family | default(_trove_ds_profile.name) }}/validation-rules.json{% endif %}"
      CMD_STDOUT=$(kubectl exec -it ${trove_taskmanager_pod_name} -n openstack -- \
        trove-manage db_load_datastore_config_parameters {{ _trove_ds_profile.name }} {{ _trove_ds_profile.version_name }} "${rules_path}")
      # echo "CMD_STDOUT: ${CMD_STDOUT}"
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  when: _trove_do_dsv | bool

- name: Assign flavors to '{{ _trove_ds_profile.version_name }}'
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      source {{ genestack_venv }}/bin/activate
      trove_taskmanager_pod_name=$(kubectl get pods -A | grep trove-task -m 1 | awk '{print $2}')
      DS_ID=$(openstack datastore show {{ _trove_ds_profile.name }} -f value -c id)
      DSV_ID=$(openstack datastore version show {{ _trove_ds_profile.version }} --datastore {{ _trove_ds_profile.name }} -f value -c id)
      CMD_STDOUT=$(kubectl exec -it ${trove_taskmanager_pod_name} -n openstack -- \
        trove-manage datastore_version_flavor_add "$DS_ID" "$DSV_ID" {{ item }})
      # echo "CMD_STDOUT: ${CMD_STDOUT}"
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  loop: "{{ trove_flavor_profiles.keys() | list }}"
  when: _trove_do_dsv | bool

# =========================================================================
# PART 3: VERIFY AND REPORT
# =========================================================================

- name: List datastores for verification
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} datastore list
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_ds_list
  changed_when: false
  when: _trove_api_check.rc == 0

- name: List datastore versions for verification
  ansible.builtin.shell:
    cmd: >
      source {{ genestack_venv }}/bin/activate &&
      openstack --os-cloud {{ os_cloud }} datastore version list "{{ trove_datastore_name }}"
    executable: /bin/bash
  environment:
    HOME: "{{ ubuntu_home }}"
  register: _trove_dsv_list
  changed_when: false
  when: _trove_api_check.rc == 0

- name: Display datastore setup results
  ansible.builtin.debug:
    msg: |
      ================================================================
        TROVE DATASTORE SETUP — COMPLETE
      ================================================================

      Datastores:
      {{ _trove_ds_list.stdout | default('(not available)') }}

      Datastore versions ({{ trove_datastore_name }}):
      {{ _trove_dsv_list.stdout | default('(not available)') }}

      Guest image: {{ trove_guest_image_name }}

      ================================================================
  when: _trove_api_check.rc == 0
